<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Draw – Phase 4b (Free Camera 3D)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #111; font-family: system-ui, -apple-system, sans-serif; }
    
    #game-container { position: relative; width: 100vw; height: 100vh; }
    
    #c2d, #c3d {
      position: absolute; top: 0; left: 0;
      width: 100%; height: calc(100% - 78px);
      display: block;
    }
    #c3d { display: none; }
    
    #top-controls {
      position: absolute; top: 16px; right: 16px;
      display: flex; gap: 10px; z-index: 20;
    }
    .ctrl-btn {
      width: 42px; height: 42px; border-radius: 50%;
      border: 2px solid #222; background: #fff; cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); user-select: none;
    }
    .ctrl-btn:hover { background: #f0f0f0; }
    
    #view-toggle {
      position: absolute; top: 16px; left: 16px; z-index: 20;
      display: flex; gap: 6px;
    }
    #view-toggle button {
      padding: 7px 14px; font-size: 13px; font-weight: 600;
      border: 2px solid #222; border-radius: 8px; background: #fff; cursor: pointer;
    }
    #view-toggle button.active { background: #2c3e50; color: #fff; }
    
    #unit-counter {
      position: absolute; bottom: 90px; left: 16px;
      background: rgba(255,255,255,0.94); border: 1px solid #ccc;
      border-radius: 8px; padding: 8px 12px; font-size: 13px;
      line-height: 1.45; max-height: 200px; overflow-y: auto; z-index: 20; min-width: 150px;
    }
    
    #palette {
      position: absolute; bottom: 0; left: 0; right: 0; height: 78px;
      background: #f8f8f8; border-top: 1px solid #ddd;
      display: flex; flex-direction: column; z-index: 20;
    }
    #tabs { display: flex; height: 28px; background: #eee; }
    .tab {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 13px; cursor: pointer; border-right: 1px solid #ddd; user-select: none;
    }
    .tab:last-child { border-right: none; }
    .tab.active { background: #fff; font-weight: 600; }
    
    #unit-row {
      flex: 1; display: flex; align-items: center; gap: 8px;
      padding: 0 12px; overflow-x: auto;
    }
    .unit-btn {
      min-width: 56px; height: 46px; border: 2px solid #bbb; border-radius: 8px;
      background: #fff; cursor: pointer; font-size: 11px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      user-select: none;
    }
    .unit-btn:hover { border-color: #666; }
    .unit-btn.selected { border-color: #222; background: #f0f0f0; box-shadow: 0 0 0 2px #222; }
    .unit-btn .emoji { font-size: 18px; line-height: 1; }
    
    #team-controls {
      position: absolute; bottom: 90px; right: 16px; z-index: 20;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
    }
    #team-toggle {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.94); border: 1px solid #ccc;
      border-radius: 8px; padding: 6px 12px; font-size: 13px;
    }
    #team-toggle label { cursor: pointer; user-select: none; }
    
    #start-btn {
      display: none; padding: 8px 18px; font-size: 14px; font-weight: 600;
      border: 2px solid #222; border-radius: 8px; background: #2ecc71; color: #fff; cursor: pointer;
    }
    #start-btn:hover { background: #27ae60; }
    #start-btn.running { background: #e74c3c; }
    
    #status {
      position: absolute; top: 60px; left: 16px;
      font-size: 12px; color: #eee; background: rgba(0,0,0,0.6);
      padding: 6px 12px; border-radius: 4px; z-index: 20; max-width: 520px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="c2d"></canvas>
    <div id="c3d"></div>
    
    <div id="view-toggle">
      <button id="btn-2d" class="active">2D</button>
      <button id="btn-3d">3D</button>
    </div>
    
    <div id="status">
      3D Camera:<br>
      WASD = move · QE = rotate · RF = up/down · XZ = look up/down
    </div>
    
    <div id="top-controls">
      <button class="ctrl-btn" id="btn-clear" title="Clear (C)">🧹</button>
      <button class="ctrl-btn" id="btn-pause" title="Pause (Space)">⏸</button>
      <button class="ctrl-btn" id="btn-mute" title="Mute (M)">🔊</button>
    </div>
    
    <div id="unit-counter">
      <strong>Units alive</strong><br>
      <span id="counter-content">None yet</span>
    </div>
    
    <div id="team-controls">
      <div id="team-toggle">
        <input type="checkbox" id="team-mode" />
        <label for="team-mode">Team Battle</label>
      </div>
      <button id="start-btn">START</button>
    </div>
    
    <div id="palette">
      <div id="tabs">
        <div class="tab active" data-tab="army">Army</div>
        <div class="tab" data-tab="animals">Animals</div>
        <div class="tab" data-tab="mythical">Mythical</div>
        <div class="tab" data-tab="terrain">Terrain</div>
      </div>
      <div id="unit-row"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // ============================================================
    // PHASE 4b – Free-fly camera (WASD + QE + RF + XZ)
    // ============================================================

    const canvas2d = document.getElementById('c2d');
    const ctx = canvas2d.getContext('2d');
    const container3d = document.getElementById('c3d');

    let mode = '2d';
    let brushSize = 28;
    let isDrawing = false;
    let isErasing = false;
    let currentUnit = null;
    let currentTab = 'army';
    let units = [];
    let projectiles = [];
    let paused = false;
    let muted = false;
    let teamMode = false;
    let battleStarted = false;
    let nextId = 1;
    let lastTime = 0;

    // Camera state
    const cam = {
      x: 0, y: 700, z: 900,
      yaw: 0,          // left/right rotation
      pitch: -0.7,     // up/down look
      speed: 420,
      turnSpeed: 2.1
    };

    const keys = {};

    // ---------- Unit defs (same as before) ----------
    const UNIT_DEFS = {
      army: [
        { id: 'soldier',   label: 'Soldier',   emoji: '🪖', color: '#4a90d9', speed: 55,  hp: 40,  dmg: 8,  range: 26, sizeMult: 1.0 },
        { id: 'sniper',    label: 'Sniper',    emoji: '🎯', color: '#2c5aa0', speed: 38,  hp: 25,  dmg: 22, range: 160, sizeMult: 0.95, ranged: true, projSpeed: 420 },
        { id: 'grenadier', label: 'Grenadier', emoji: '💣', color: '#e67e22', speed: 48,  hp: 35,  dmg: 18, range: 70,  sizeMult: 1.05, ranged: true, projSpeed: 280 },
        { id: 'roman',     label: 'Roman',     emoji: '🛡️', color: '#c0392b', speed: 50,  hp: 60,  dmg: 11, range: 28,  sizeMult: 1.1 },
        { id: 'archer',    label: 'Archer',    emoji: '🏹', color: '#27ae60', speed: 45,  hp: 28,  dmg: 14, range: 130, sizeMult: 0.95, ranged: true, projSpeed: 380 },
        { id: 'cavalry',   label: 'Cavalry',   emoji: '🐴', color: '#8e44ad', speed: 95,  hp: 48,  dmg: 13, range: 30,  sizeMult: 1.15 },
        { id: 'ninja',     label: 'Ninja',     emoji: '🥷', color: '#2c3e50', speed: 78,  hp: 32,  dmg: 16, range: 28,  sizeMult: 0.95 },
        { id: 'flame',     label: 'Flamethrower', emoji: '🔥', color: '#e74c3c', speed: 42, hp: 40, dmg: 7, range: 55, sizeMult: 1.05, flame: true },
      ],
      animals: [
        { id: 'boar',      label: 'Boar',      emoji: '🐗', color: '#a0522d', speed: 68,  hp: 55,  dmg: 12, range: 26, sizeMult: 1.15 },
        { id: 'rat',       label: 'Rat',       emoji: '🐀', color: '#7f8c8d', speed: 85,  hp: 14,  dmg: 5,  range: 18, sizeMult: 0.7 },
        { id: 'piranha',   label: 'Piranha',   emoji: '🐟', color: '#1abc9c', speed: 75,  hp: 20,  dmg: 9,  range: 20, sizeMult: 0.85 },
        { id: 'cheetah',   label: 'Cheetah',   emoji: '🐆', color: '#f1c40f', speed: 120, hp: 30,  dmg: 11, range: 24, sizeMult: 1.05 },
        { id: 'gorilla',   label: 'Gorilla',   emoji: '🦍', color: '#5d4037', speed: 48,  hp: 90,  dmg: 18, range: 32, sizeMult: 1.35 },
        { id: 'frog',      label: 'Frog',      emoji: '🐸', color: '#2ecc71', speed: 55,  hp: 22,  dmg: 7,  range: 22, sizeMult: 0.9 },
      ],
      mythical: [
        { id: 'zombie',    label: 'Zombie',    emoji: '🧟', color: '#7dcea0', speed: 28,  hp: 50,  dmg: 9,  range: 24, sizeMult: 1.05 },
        { id: 'slime',     label: 'Slime',     emoji: '🟢', color: '#ff69b4', speed: 35,  hp: 38,  dmg: 6,  range: 22, sizeMult: 1.0 },
        { id: 'mage',      label: 'Mage',      emoji: '🧙', color: '#9b59b6', speed: 38,  hp: 26,  dmg: 24, range: 140, sizeMult: 1.0, ranged: true, projSpeed: 320 },
        { id: 'giant',     label: 'Giant',     emoji: '👹', color: '#34495e', speed: 26,  hp: 180, dmg: 28, range: 42, sizeMult: 1.85 },
        { id: 'dragon',    label: 'Dragon',    emoji: '🐉', color: '#c0392b', speed: 42,  hp: 140, dmg: 30, range: 70, sizeMult: 1.55, ranged: true, projSpeed: 300 },
        { id: 'necro',     label: 'Necromancer', emoji: '💀', color: '#2c3e50', speed: 36, hp: 42, dmg: 16, range: 110, sizeMult: 1.05, ranged: true, projSpeed: 290 },
      ],
      terrain: [
        { id: 'wall',   label: 'Wall',   emoji: '🧱', color: '#95a5a6', speed: 0, hp: 9999, dmg: 0, range: 0, sizeMult: 1.2, isTerrain: true },
        { id: 'water',  label: 'Water',  emoji: '💧', color: '#3498db', speed: 0, hp: 9999, dmg: 0, range: 0, sizeMult: 1.0, isTerrain: true },
        { id: 'ice',    label: 'Ice',    emoji: '❄️', color: '#aed6f1', speed: 0, hp: 9999, dmg: 0, range: 0, sizeMult: 1.0, isTerrain: true },
        { id: 'mine',   label: 'Mine',   emoji: '💣', color: '#e74c3c', speed: 0, hp: 25,  dmg: 50, range: 35, sizeMult: 0.9, isTerrain: true },
        { id: 'banana', label: 'Banana', emoji: '🍌', color: '#f1c40f', speed: 0, hp: 12,  dmg: 0,  range: 0, sizeMult: 0.8, isTerrain: true },
        { id: 'barrel', label: 'Barrel', emoji: '🛢️', color: '#8b4513', speed: 0, hp: 35,  dmg: 0,  range: 0, sizeMult: 1.1, isTerrain: true },
        { id: 'tree',   label: 'Tree',   emoji: '🌳', color: '#27ae60', speed: 0, hp: 70,  dmg: 0,  range: 0, sizeMult: 1.3, isTerrain: true },
      ]
    };

    // ---------- 3D ----------
    let scene, camera, renderer3d, billboards = new Map();

    function init3D() {
      const w = window.innerWidth;
      const h = window.innerHeight - 78;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd6e4f0);

      camera = new THREE.PerspectiveCamera(60, w / h, 1, 8000);

      renderer3d = new THREE.WebGLRenderer({ antialias: true });
      renderer3d.setSize(w, h);
      renderer3d.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container3d.appendChild(renderer3d.domElement);

      const ambient = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff, 0.55);
      dir.position.set(400, 800, 300);
      scene.add(dir);

      const geo = new THREE.PlaneGeometry(4000, 3000);
      const mat = new THREE.MeshLambertMaterial({ color: 0xe8eef5 });
      const ground = new THREE.Mesh(geo, mat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const grid = new THREE.GridHelper(4000, 40, 0xbbbbbb, 0xd0d0d0);
      grid.position.y = 1;
      scene.add(grid);
    }

    function createEmojiTexture(emoji, size = 128) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const cx = c.getContext('2d');
      cx.font = `${size * 0.75}px serif`;
      cx.textAlign = 'center';
      cx.textBaseline = 'middle';
      cx.fillText(emoji, size/2, size/2 + 4);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    function getOrCreateBillboard(unit) {
      if (billboards.has(unit.id)) return billboards.get(unit.id);
      const tex = createEmojiTexture(unit.emoji);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      const s = unit.radius * 2.8;
      sprite.scale.set(s, s, 1);
      scene.add(sprite);
      billboards.set(unit.id, sprite);
      return sprite;
    }

    function clearBillboards() {
      billboards.forEach(s => {
        scene.remove(s);
        if (s.material.map) s.material.map.dispose();
        s.material.dispose();
      });
      billboards.clear();
    }

    // ---------- Camera movement ----------
    function updateCamera(dt) {
      if (mode !== '3d') return;

      // Rotation
      if (keys['q']) cam.yaw += cam.turnSpeed * dt;
      if (keys['e']) cam.yaw -= cam.turnSpeed * dt;
      if (keys['x']) cam.pitch += cam.turnSpeed * 0.7 * dt;
      if (keys['z']) cam.pitch -= cam.turnSpeed * 0.7 * dt;

      // Clamp pitch so we don't flip
      cam.pitch = Math.max(-1.4, Math.min(0.2, cam.pitch));

      // Movement relative to yaw
      const forward = new THREE.Vector3(
        -Math.sin(cam.yaw),
        0,
        -Math.cos(cam.yaw)
      );
      const right = new THREE.Vector3(
        Math.cos(cam.yaw),
        0,
        -Math.sin(cam.yaw)
      );

      const move = new THREE.Vector3();
      if (keys['w']) move.add(forward);
      if (keys['s']) move.sub(forward);
      if (keys['a']) move.sub(right);
      if (keys['d']) move.add(right);

      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(cam.speed * dt);
        cam.x += move.x;
        cam.z += move.z;
      }

      // Up / Down
      if (keys['r']) cam.y += cam.speed * 0.7 * dt;
      if (keys['f']) cam.y -= cam.speed * 0.7 * dt;
      cam.y = Math.max(80, Math.min(2500, cam.y));

      // Apply to Three.js camera
      camera.position.set(cam.x, cam.y, cam.z);

      const lookDist = 800;
      const lookX = cam.x - Math.sin(cam.yaw) * Math.cos(cam.pitch) * lookDist;
      const lookY = cam.y + Math.sin(cam.pitch) * lookDist;
      const lookZ = cam.z - Math.cos(cam.yaw) * Math.cos(cam.pitch) * lookDist;

      camera.lookAt(lookX, lookY, lookZ);
    }

    // ---------- Shared helpers (same as before) ----------
    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight - 78;
      canvas2d.width = w;
      canvas2d.height = h;
      if (renderer3d) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer3d.setSize(w, h);
      }
    }
    window.addEventListener('resize', resize);

    function getPos(e) {
      const el = mode === '2d' ? canvas2d : (renderer3d ? renderer3d.domElement : canvas2d);
      const rect = el.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function screenToWorld(sx, sy) {
      // Simple approximation – good enough for now
      const w = canvas2d.width, h = canvas2d.height;
      return {
        x: (sx / w - 0.5) * 2200 + cam.x * 0.3,
        y: (sy / h - 0.5) * 1600 + cam.z * 0.3
      };
    }

    function getTeamForX(x) {
      if (!teamMode) return 0;
      return x < 0 ? 1 : 2;
    }

    // ---------- UI + Placement (same logic) ----------
    function renderTabs() {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
    }
    function renderUnitButtons() {
      const row = document.getElementById('unit-row');
      row.innerHTML = '';
      (UNIT_DEFS[currentTab] || []).forEach(u => {
        const btn = document.createElement('button');
        btn.className = 'unit-btn' + (currentUnit && currentUnit.id === u.id ? ' selected' : '');
        btn.innerHTML = `<div class="emoji">${u.emoji}</div>${u.label}`;
        btn.onclick = () => { currentUnit = u; renderUnitButtons(); };
        row.appendChild(btn);
      });
      if (!currentUnit && UNIT_DEFS[currentTab]?.length) {
        currentUnit = UNIT_DEFS[currentTab][0];
        renderUnitButtons();
      }
    }
    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        currentTab = t.dataset.tab;
        currentUnit = null;
        renderTabs();
        renderUnitButtons();
      });
    });
    renderTabs();
    renderUnitButtons();

    function placeUnit(sx, sy) {
      if (!currentUnit) return;
      let x, y;
      if (mode === '2d') { x = sx; y = sy; }
      else { const w = screenToWorld(sx, sy); x = w.x; y = w.y; }

      const minDist = brushSize * 0.55;
      for (const u of units) {
        const dx = u.x - x, dy = u.y - y;
        if (dx*dx + dy*dy < minDist*minDist) return;
      }

      const def = currentUnit;
      const radius = brushSize * 0.38 * (def.sizeMult || 1);

      units.push({
        id: nextId++, x, y, vx: 0, vy: 0,
        type: def.id, label: def.label, emoji: def.emoji, color: def.color,
        radius, maxHp: def.hp, hp: def.hp, speed: def.speed, dmg: def.dmg, range: def.range,
        team: getTeamForX(x), isTerrain: !!def.isTerrain,
        ranged: !!def.ranged, flame: !!def.flame, projSpeed: def.projSpeed || 300,
        hitFlash: 0, attackCooldown: 0
      });
      updateCounter();
    }

    function eraseAt(sx, sy) {
      let x, y;
      if (mode === '2d') { x = sx; y = sy; }
      else { const w = screenToWorld(sx, sy); x = w.x; y = w.y; }
      const r = brushSize * 0.7;
      const before = units.length;
      units = units.filter(u => {
        const dx = u.x - x, dy = u.y - y;
        return dx*dx + dy*dy > r*r;
      });
      if (units.length !== before) {
        updateCounter();
        if (mode === '3d') clearBillboards();
      }
    }

    function updateCounter() {
      const counts = {};
      let alive = 0;
      units.forEach(u => {
        if (u.isTerrain) return;
        counts[u.label] = (counts[u.label] || 0) + 1;
        alive++;
      });
      document.getElementById('counter-content').innerHTML = alive === 0 ? 'None yet' :
        Object.entries(counts).map(([k,v]) => `${k}: ${v}`).join('<br>') + `<br><strong>Total: ${alive}</strong>`;
    }

    // ---------- Simulation (unchanged) ----------
    function isEnemy(a, b) {
      if (a === b || a.isTerrain || b.isTerrain || a.hp <= 0 || b.hp <= 0) return false;
      if (teamMode) return a.team !== 0 && b.team !== 0 && a.team !== b.team;
      return a.type !== b.type;
    }
    function findNearestEnemy(unit) {
      let best = null, bestDist = Infinity;
      for (const other of units) {
        if (!isEnemy(unit, other)) continue;
        const dx = other.x - unit.x, dy = other.y - unit.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < bestDist) { bestDist = dist; best = other; }
      }
      return { target: best, dist: bestDist };
    }
    function spawnProjectile(from, to) {
      const dx = to.x - from.x, dy = to.y - from.y;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      projectiles.push({
        x: from.x, y: from.y,
        vx: (dx/len)*from.projSpeed, vy: (dy/len)*from.projSpeed,
        dmg: from.dmg, team: from.team, ownerType: from.type, life: 2.2, radius: 5
      });
    }
    function updateSimulation(dt) {
      if (paused || (teamMode && !battleStarted)) return;

      for (const u of units) {
        if (u.isTerrain || u.hp <= 0) continue;
        u.attackCooldown = Math.max(0, u.attackCooldown - dt);
        u.hitFlash = Math.max(0, u.hitFlash - dt);

        const { target, dist } = findNearestEnemy(u);
        if (target) {
          if (dist > u.range * 0.9) {
            const dx = target.x - u.x, dy = target.y - u.y;
            const len = Math.sqrt(dx*dx + dy*dy) || 1;
            u.vx = (dx/len)*u.speed; u.vy = (dy/len)*u.speed;
          } else {
            u.vx *= 0.65; u.vy *= 0.65;
            if (u.attackCooldown <= 0) {
              if (u.flame) { target.hp -= u.dmg; target.hitFlash = 0.15; u.attackCooldown = 0.18; }
              else if (u.ranged) { spawnProjectile(u, target); u.attackCooldown = 0.7; }
              else { target.hp -= u.dmg; target.hitFlash = 0.18; u.attackCooldown = 0.55; }
            }
          }
        } else { u.vx *= 0.92; u.vy *= 0.92; }
        u.x += u.vx * dt; u.y += u.vy * dt;
      }

      for (let i = projectiles.length-1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
        let hit = false;
        for (const u of units) {
          if (u.isTerrain || u.hp <= 0) continue;
          if (teamMode && p.team === u.team) continue;
          if (!teamMode && p.ownerType === u.type) continue;
          const dx = u.x-p.x, dy = u.y-p.y;
          if (dx*dx + dy*dy < (u.radius+p.radius)**2) {
            u.hp -= p.dmg; u.hitFlash = 0.2; hit = true; break;
          }
        }
        if (hit || p.life <= 0) projectiles.splice(i, 1);
      }

      const before = units.length;
      units = units.filter(u => u.hp > 0);
      if (units.length !== before) {
        updateCounter();
        if (mode === '3d') clearBillboards();
      }
    }

    // ---------- Render ----------
    function draw2D() {
      ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas2d.width, canvas2d.height);

      if (teamMode) {
        ctx.fillStyle = 'rgba(231,76,60,0.07)';
        ctx.fillRect(0, 0, canvas2d.width/2, canvas2d.height);
        ctx.fillStyle = 'rgba(52,152,219,0.07)';
        ctx.fillRect(canvas2d.width/2, 0, canvas2d.width/2, canvas2d.height);
        ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 3; ctx.setLineDash([12,8]);
        ctx.beginPath(); ctx.moveTo(canvas2d.width/2, 0); ctx.lineTo(canvas2d.width/2, canvas2d.height); ctx.stroke();
        ctx.setLineDash([]);
      }

      for (const u of units) {
        const flash = u.hitFlash > 0;
        ctx.beginPath(); ctx.arc(u.x, u.y, u.radius, 0, Math.PI*2);
        ctx.fillStyle = flash ? '#fff' : u.color + '55'; ctx.fill();
        if (teamMode) {
          ctx.strokeStyle = u.team === 1 ? '#c0392b' : '#2980b9'; ctx.lineWidth = 2.5; ctx.stroke();
        }
        ctx.font = `${Math.floor(u.radius*1.55)}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#000'; ctx.fillText(u.emoji, u.x, u.y+1);

        if (!u.isTerrain && u.hp < u.maxHp) {
          const barW = u.radius*1.7, pct = Math.max(0, u.hp/u.maxHp);
          ctx.fillStyle = '#333'; ctx.fillRect(u.x-barW/2, u.y-u.radius-9, barW, 4);
          ctx.fillStyle = pct > 0.4 ? '#2ecc71' : '#e74c3c';
          ctx.fillRect(u.x-barW/2, u.y-u.radius-9, barW*pct, 4);
        }
      }
      for (const p of projectiles) {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fillStyle = '#222'; ctx.fill();
      }
    }

    function draw3D() {
      const alive = new Set();
      for (const u of units) {
        alive.add(u.id);
        const sp = getOrCreateBillboard(u);
        sp.position.set(u.x, u.radius * 1.3, u.y);
        const s = u.radius * 2.8;
        sp.scale.set(s, s, 1);
        sp.material.opacity = u.hitFlash > 0 ? 0.45 : 1;
      }
      for (const [id, sp] of billboards) {
        if (!alive.has(id)) {
          scene.remove(sp);
          if (sp.material.map) sp.material.map.dispose();
          sp.material.dispose();
          billboards.delete(id);
        }
      }
      renderer3d.render(scene, camera);
    }

    // ---------- Main loop ----------
    function loop(t) {
      if (!lastTime) lastTime = t;
      const dt = Math.min(0.05, (t - lastTime) / 1000);
      lastTime = t;

      updateCamera(dt);
      updateSimulation(dt);

      if (mode === '2d') draw2D();
      else draw3D();

      requestAnimationFrame(loop);
    }

    // ---------- Mode switch ----------
    function setMode(m) {
      mode = m;
      document.getElementById('btn-2d').classList.toggle('active', m === '2d');
      document.getElementById('btn-3d').classList.toggle('active', m === '3d');
      canvas2d.style.display = m === '2d' ? 'block' : 'none';
      container3d.style.display = m === '3d' ? 'block' : 'none';

      if (m === '3d') {
        if (!renderer3d) init3D();
        clearBillboards();
        // reset camera to a nice starting position
        cam.x = 0; cam.y = 700; cam.z = 900;
        cam.yaw = 0; cam.pitch = -0.65;
      }
    }
    document.getElementById('btn-2d').onclick = () => setMode('2d');
    document.getElementById('btn-3d').onclick = () => setMode('3d');

    // ---------- Input ----------
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;

      if (e.code === 'Space') { e.preventDefault(); document.getElementById('btn-pause').click(); }
      else if (e.key.toLowerCase() === 'c') document.getElementById('btn-clear').click();
      else if (e.key.toLowerCase() === 'm') document.getElementById('btn-mute').click();
      else if (e.key === 'Tab') {
        e.preventDefault();
        const tabs = ['army','animals','mythical','terrain'];
        currentTab = tabs[(tabs.indexOf(currentTab)+1) % tabs.length];
        currentUnit = null; renderTabs(); renderUnitButtons();
      }
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

    function onPointerDown(e) {
      const pos = getPos(e);
      if (e.button === 0) { isDrawing = true; placeUnit(pos.x, pos.y); }
      else if (e.button === 2) { isErasing = true; eraseAt(pos.x, pos.y); }
    }
    function onPointerMove(e) {
      const pos = getPos(e);
      if (isDrawing) placeUnit(pos.x, pos.y);
      else if (isErasing) eraseAt(pos.x, pos.y);
    }
    window.addEventListener('mouseup', () => { isDrawing = false; isErasing = false; });

    canvas2d.addEventListener('mousedown', onPointerDown);
    canvas2d.addEventListener('mousemove', onPointerMove);
    canvas2d.addEventListener('contextmenu', e => e.preventDefault());

    // Attach 3D events when switching
    const originalSetMode = setMode;
    setMode = function(m) {
      originalSetMode(m);
      if (m === '3d' && renderer3d) {
        const el = renderer3d.domElement;
        el.addEventListener('mousedown', onPointerDown);
        el.addEventListener('mousemove', onPointerMove);
        el.addEventListener('contextmenu', e => e.preventDefault());
      }
    };

    // Buttons
    document.getElementById('btn-clear').onclick = () => {
      units = []; projectiles = []; battleStarted = false;
      clearBillboards(); updateStartButton(); updateCounter();
    };
    document.getElementById('btn-pause').onclick = () => {
      paused = !paused;
      document.getElementById('btn-pause').textContent = paused ? '▶' : '⏸';
    };
    document.getElementById('btn-mute').onclick = () => {
      muted = !muted;
      document.getElementById('btn-mute').textContent = muted ? '🔇' : '🔊';
    };

    const startBtn = document.getElementById('start-btn');
    function updateStartButton() {
      if (teamMode) {
        startBtn.style.display = 'block';
        startBtn.textContent = battleStarted ? 'RUNNING…' : 'START';
        startBtn.classList.toggle('running', battleStarted);
      } else {
        startBtn.style.display = 'none';
        battleStarted = false;
      }
    }
    document.getElementById('team-mode').onchange = e => {
      teamMode = e.target.checked;
      battleStarted = false;
      units.forEach(u => { if (!u.isTerrain) u.team = getTeamForX(u.x); });
      updateStartButton();
    };
    startBtn.onclick = () => { if (teamMode) { battleStarted = true; updateStartButton(); } };

    // Boot
    resize();
    setMode('2d');
    requestAnimationFrame(loop);
  </script>
</body>
</html>
